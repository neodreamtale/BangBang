version: '3.8'

services:
  punch-0818:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dev-0818
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ~/.ssh:/root/.ssh
    restart: unless-stopped
    command: npm run dev
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge